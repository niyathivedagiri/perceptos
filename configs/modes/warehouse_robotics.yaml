mode: warehouse_robotics
display_name: Warehouse Robotics
description: >
  Indoor AMR perception. Flat floors mean terrain analysis is redundant, but
  the scene is full of moving people and forklifts, so tracking and state
  estimation carry the load instead.

rover:
  max_slope_deg: 5.0
  critical_slope_deg: 8.0
  max_step_m: 0.02
  cruise_speed_mps: 1.5

comms:
  one_way_light_time_s: [0, 0]
  supervision: supervised

stages:
  acquisition:      { enabled: true,  params: { cameras: [front_rgb, rear_rgb] } }
  calibration:      { enabled: true }
  image_processing: { enabled: true }
  features:         { enabled: true,  params: { detector: ORB, max_features: 1000 } }
  stereo:           { enabled: true,  params: { matcher: SGBM, num_disparities: 96 } }
  depth:            { enabled: true }
  reconstruction:   { enabled: false }               # no science value indoors
  occupancy:        { enabled: true,  params: { cell_size_m: 0.05, extent_m: 40 } }
  traversability:   { enabled: false }               # floors are flat by construction
  detection:        { enabled: true,  params: { model: models/yolo11n.pt, conf: 0.5 } }
  tracking:         { enabled: true,  params: { tracker: CSRT, max_tracks: 32 } }
  state_estimation: { enabled: true,  params: { process_noise_std: 1.5 } }
  visual_odometry:  { enabled: true }
  slip:             { enabled: false }
  servoing:         { enabled: true,  params: { gain: 0.8, max_linear: 0.6 } }
  planner:          { enabled: true,  params: { cost_weight: 2.0, inflation_radius_m: 0.4 } }
