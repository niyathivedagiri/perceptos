[project]
name = "perceptos"
version = "0.1.0"
description = "Enterprise robotic perception, autonomy and planetary exploration platform"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "opencv-contrib-python>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3",
    "filterpy>=1.4.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "reportlab>=4.1",
    "pandas>=2.2",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]
reconstruction = ["open3d>=0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/perceptos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
